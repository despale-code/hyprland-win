# #######################################################################################
# HYPRLAND-WIN — WAYLAND & HYPRLAND COMPOSITOR FOR WINDOWS NT (HOLLOWED DWM)
# Config Location: ~/.config/hyprwin/hyprland.conf (Hot-reloads automatically at runtime)
# #######################################################################################

$mainMod = SUPER
$terminal = alacritty.exe
$launcher = hyprlauncher.exe --toggle

monitor = , preferred, auto, 1
weather_location = Istanbul, Tuzla

# Programs to launch on startup (Wayland layer-shell or Win32 apps)
# exec-once = waybar
# exec-once = hyprpaper

general {
    gaps_in = 6
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(e4e4e7d9) rgba(a1a1aad9) 45deg
    col.inactive_border = rgba(3f3f4666)
    layout = dwindle
    allow_tearing = true
    direct_scanout = true
}

decoration {
    rounding = 22
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
        size = 8
        passes = 3
        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56

    animation = windows, 1, 6, myBezier
    animation = windowsOut, 1, 5, smoothOut, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, overshot, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    mfact = 0.55
    new_status = master
}

# Window Rules for Gaming (Zero-Latency Independent Flip Direct Scanout)
windowrulev2 = immediate, class:^(cs2\.exe)$
windowrulev2 = fullscreen, class:^(cs2\.exe)$
windowrulev2 = immediate, class:^(project8\.exe)$
windowrulev2 = immediate, class:^(Client-Win64-Shipping\.exe)$
windowrulev2 = float, class:^(keypirinha-x64\.exe)$

# Keybindings ($mainMod = SUPER = Windows Key, ALT = Alt Key)
bind = $mainMod, T, exec, $terminal
bind = $mainMod, R, exec, $launcher
bind = $mainMod, SPACE, exec, $launcher
bind = ALT, SPACE, exec, $launcher
bind = $mainMod ALT, L, exec, hyprlock.exe
bind = , PRINT, exec, hyprshot.exe -m region
bind = $mainMod SHIFT, S, exec, hyprshot.exe -m region
bind = SHIFT, PRINT, exec, hyprshot.exe -m output
bind = $mainMod, W, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, M, exit,
# Emergency Panic Combo: Uncloak all windows, restore DWM attributes, restart explorer.exe, and exit Hyprland-Win
bind = $mainMod ALT SHIFT, W, exit,
bind = $mainMod, E, exec, chickenwm-files.exe
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, exec, hyprlauncher.exe --clipboard
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, G, togglegroup,
bind = $mainMod, TAB, changegroupactive, f
bind = ALT, TAB, cyclenext,
bind = $mainMod, S, togglespecialworkspace,

# Move focus with SUPER + arrow keys / vim keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u

# Move/swap window in direction with SUPER + SHIFT + arrow keys / vim keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u

# Switch workspaces with SUPER + [1-9, 0]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [1-9, 0]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse Binds (SUPER + Left-Click Drag to Move/Swap, SUPER + Right-Click Drag to Scale/Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:274, togglefloating
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
